services:
  api:
    command: uv run --no-sync --no-dev uvicorn server.main:app --host 0.0.0.0 --port 5050 --no-server-header
  worker:
    command: uv run --no-sync --no-dev arq server.worker_main.WorkerSettings
  postgres:
    volumes: !override
      - postgres_local:/var/lib/postgresql/data
  assistant-web:
    image: nginx:1.27-alpine
    container_name: quickdone-kb-assistant-web
    ports:
      - "5174:80"
    volumes:
      - ${ASSISTANT_APP_DIR:-../KnowledgeBase}/dist:/usr/share/nginx/html:ro
      - ${ASSISTANT_APP_DIR:-../KnowledgeBase}/deploy/production-ip/assistant.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    restart: unless-stopped
volumes:
  postgres_local:
    external: true
    name: knowledgebase-yuxi-postgres-local
